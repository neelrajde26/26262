version: '3.8'

services:
  flowguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aicte-flowguard
    restart: unless-stopped
    ports:
      - "5500:5500"
    environment:
      - PORT=5500
      - NODE_ENV=production
      - JWT_SECRET=flowguard-sih2026-production-hmac-key-replace-in-cloud
    volumes:
      - flowguard-data:/app/data
      - flowguard-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5500/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  flowguard-data:
    driver: local
  flowguard-uploads:
    driver: local
